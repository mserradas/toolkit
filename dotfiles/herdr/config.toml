onboarding = false

[theme]
name = "terminal"
auto_switch = false

[terminal]
default_shell = "fish"
shell_mode = "auto"
new_cwd = "follow"

[keys]
prefix = "ctrl+a"

[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "PATH=\"/opt/homebrew/bin:/usr/local/bin:$PATH\"; export PATH; exec fish -l -C 'bind \\ca\\eg exit'"
description = "abrir o cerrar terminal temporal"
width = "90%"
height = "90%"

[ui]
prompt_new_tab_name = false
pane_gaps = false
agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = true

[ui.sidebar.agents]
rows = [["state_icon", "workspace"], ["terminal_title_stripped"]]

[ui.sidebar.spaces]
rows = [["state_icon", "workspace", "branch", "git_status"]]

# herdr-focus-notify owns agent notifications; avoid duplicate native alerts.
[ui.toast]
delivery = "off"

[ui.toast.clipboard]
enabled = false

[ui.sound]
enabled = false

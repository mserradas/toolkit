# --- CONFIGURACIÓN GENERAL ---
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
setw -g automatic-rename on
setw -g automatic-rename-format "#{?#{==:#{pane_current_path},#{HOME}},#{l:~},#{b:pane_current_path}}"
set -g history-limit 50000
set -sg escape-time 10

# --- GESTOR DE PLUGINS (TPM) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-processes 'opencode'
set -g @plugin 'alexwforsythe/tmux-which-key'

# --- VENTANA FLOTANTE (Alt + g) ---
bind-key -n M-g if-shell -F '#{==:#{session_name},scratch}' {
  detach-client
} {
  display-popup -d "#{pane_current_path}" -E "tmux new-session -A -s scratch"
}

# --- TEMA CATPPUCCIN MOCHA ---
set -g @plugin 'Nybkox/tmux-ukiyo'
set -g @ukiyo-theme 'catppuccin/mocha'
set -g @ukiyo-plugins "cpu-usage ram-usage git time"
set -g @ukiyo-time-format "%d/%m/%y %H:%M"
set -g @ukiyo-ignore-window-colors true
set -g status-position bottom

# --- GUARDADO AUTOMÁTICO DE SESIONES ---
# Debe cargarse después del tema para conservar su tarea periódica en status-right.
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# --- TERMINAL Y COLOR ---
set -g default-terminal "tmux-256color"
set -s terminal-features[100] "xterm-256color:RGB"
set -s terminal-features[101] "xterm-ghostty:RGB:extkeys"
set -s extended-keys on
set -s extended-keys-format csi-u
set -g focus-events on

# --- MODO VI ---
set -g mode-keys vi

# --- KEYMAPS ---
unbind C-b
set -g prefix C-a
bind C-a send-prefix

unbind %
unbind '"'
bind c new-window -c "#{HOME}"
bind v split-window -h -c "#{pane_current_path}"
bind d split-window -v -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display-message "tmux recargado"
bind -r < swap-window -t -1
bind -r > swap-window -t +1

set -g mouse on

bind K confirm-before -p "Kill all other sessions? (y/n)" "kill-session -a"

# --- OVERRIDES LOCALES ---
source-file -q ~/.tmux.local.conf

# --- TPM (mantener al final) ---
run '~/.tmux/plugins/tpm/tpm'
